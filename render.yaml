services:
  - type: web
    name: finance-project-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CARGO_HOME
        value: /opt/render/project/src/.cargo
      - key: PYO3_USE_ABI3_FORWARD_COMPATIBILITY
        value: "1"